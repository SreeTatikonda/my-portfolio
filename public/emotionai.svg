<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Emotion detection illustration</title>
  <desc id="desc">Abstract interface with chat bubbles and sentiment graph</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6A25A"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="#0b1221"/>
  <rect x="16" y="16" width="608" height="328" rx="16" fill="url(#panel)" stroke="#F6A25A" stroke-width="3" opacity="0.65"/>
  <rect x="60" y="60" width="220" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <rect x="360" y="60" width="220" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <text x="72" y="96" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f7f7f7">How are users feeling?</text>
  <text x="372" y="96" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f7f7f7">Real-time prediction</text>
  <g fill="#f1f5f9" font-family="'Inter','Segoe UI',sans-serif" font-size="13" opacity="0.85">
    <text x="76" y="124">"Excited to deploy the model today!"</text>
    <text x="76" y="142">"Feeling a bit stuck on preprocessing"</text>
    <text x="372" y="124">Joy: 0.82</text>
    <text x="372" y="142">Frustration: 0.63</text>
  </g>
  <g transform="translate(80 170)">
    <polyline points="0,120 70,70 140,80 210,30 280,55 340,40 420,70" fill="none" stroke="url(#warm)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="6" fill="#F6A25A"/>
    <circle cx="210" cy="30" r="6" fill="#F6A25A"/>
    <circle cx="340" cy="40" r="6" fill="#F6A25A"/>
  </g>
  <rect x="80" y="290" width="480" height="36" rx="10" fill="#0b1221" stroke="#F6A25A" stroke-width="2" opacity="0.6"/>
  <text x="320" y="314" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f7f7f7">Emotion Detection • Transformers • Real-time UI</text>
</svg>
