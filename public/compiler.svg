<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">C Compiler illustration</title>
  <desc id="desc">Abstract pipeline showing code parsing and generation</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6A25A"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="324" rx="16" fill="none" stroke="#F6A25A" stroke-width="3" opacity="0.65"/>
  <g transform="translate(60 120)" fill="#0f172a" stroke="#F6A25A" stroke-width="3" stroke-linejoin="round">
    <rect width="130" height="70" rx="12"/>
    <rect x="170" width="130" height="70" rx="12"/>
    <rect x="340" width="130" height="70" rx="12"/>
  </g>
  <g fill="#f7f7f7" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="700">
    <text x="125" y="162" text-anchor="middle">Parsing</text>
    <text x="295" y="162" text-anchor="middle">IR Build</text>
    <text x="465" y="162" text-anchor="middle">Code Gen</text>
  </g>
  <g stroke="url(#accent)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M190 155h70"/><path d="M360 155h70"/>
  </g>
  <rect x="120" y="210" width="400" height="30" rx="10" fill="#0d1117" stroke="#F6A25A" stroke-width="2" opacity="0.7"/>
  <text x="320" y="232" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f7f7f7">Semantic Analysis • Optimization • Emission</text>
  <circle cx="70" cy="80" r="12" fill="#F6A25A"/><circle cx="570" cy="80" r="12" fill="#F6A25A"/>
  <text x="70" y="70" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="800" fill="#0d1117">C</text>
  <text x="570" y="70" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="800" fill="#0d1117">EXE</text>
</svg>
