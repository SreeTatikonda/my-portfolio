<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Resume Analyser illustration</title>
  <desc id="desc">Dashboard showing resume match scoring with accent progress bars</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#0f1d35"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6A25A"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="324" rx="16" fill="none" stroke="#F6A25A" stroke-width="3" opacity="0.65"/>
  <rect x="60" y="60" width="220" height="80" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="2"/>
  <rect x="360" y="60" width="220" height="80" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="2"/>
  <text x="76" y="94" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f7f7f7">Resume Insights</text>
  <text x="376" y="94" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f7f7f7">Match Score</text>
  <g fill="#f1f5f9" font-family="'Inter','Segoe UI',sans-serif" font-size="13" opacity="0.85">
    <text x="76" y="120">• Skills coverage detected</text>
    <text x="76" y="140">• Keywords aligned to JD</text>
    <text x="376" y="120">Overall: 86%</text>
    <text x="376" y="140">Top match: Data Engineer</text>
  </g>
  <g transform="translate(80 170)">
    <text x="0" y="0" font-family="'Inter','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f7f7f7">Relevance</text>
    <rect y="10" width="400" height="14" rx="7" fill="#111827"/>
    <rect y="10" width="320" height="14" rx="7" fill="url(#bar)"/>
    <text x="410" y="22" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#f7f7f7">80%</text>
  </g>
  <g transform="translate(80 210)">
    <text x="0" y="0" font-family="'Inter','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f7f7f7">Clarity</text>
    <rect y="10" width="400" height="14" rx="7" fill="#111827"/>
    <rect y="10" width="360" height="14" rx="7" fill="url(#bar)"/>
    <text x="410" y="22" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#f7f7f7">90%</text>
  </g>
  <g transform="translate(80 250)">
    <text x="0" y="0" font-family="'Inter','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f7f7f7">Alignment</text>
    <rect y="10" width="400" height="14" rx="7" fill="#111827"/>
    <rect y="10" width="340" height="14" rx="7" fill="url(#bar)"/>
    <text x="410" y="22" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#f7f7f7">85%</text>
  </g>
  <rect x="160" y="300" width="320" height="32" rx="10" fill="#0b132b" stroke="#F6A25A" stroke-width="2" opacity="0.6"/>
  <text x="320" y="322" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f7f7f7">AI Resume Analyser • NLP • Matching</text>
</svg>
