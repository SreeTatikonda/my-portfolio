  <g stroke="#F6A25A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M250 115h50"/><path d="M250 234h50"/><path d="M340 115h50"/><path d="M340 234h50"/>
    <path d="M320 178v-46"/><path d="M320 178v46"/>
