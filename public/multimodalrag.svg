  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="324" rx="16" fill="none" stroke="#F6A25A" stroke-width="3" opacity="0.65"/>
  <g fill="#0e172a" stroke="#F6A25A" stroke-width="3" opacity="0.9">
    <rect x="80" y="70" width="170" height="90" rx="12"/>
