<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-labelledby="title desc">
  <title id="title">Iowa State University logo</title>
  <desc id="desc">Minimal Iowa State wordmark on cardinal red background</desc>
  <rect x="6" y="10" width="228" height="100" rx="14" fill="#C8102E"/>
  <rect x="6" y="10" width="228" height="100" rx="14" fill="none" stroke="#F6A25A" stroke-width="4" opacity="0.75"/>
  <text x="120" y="66" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" font-size="32" font-weight="700" fill="#fff">IOWA STATE</text>
  <text x="120" y="92" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff8f0" letter-spacing="1.5">UNIVERSITY</text>
